<div id="page-dashboard" class="view-section">
  <div class="grid grid-cols-2 gap-4 mb-6">
    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total SKU</p>
      <p class="text-3xl font-bold text-slate-800" id="dash-total-sku">0</p>
    </div>
    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
      <p class="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-1">Low Stock</p>
      <p class="text-3xl font-bold text-rose-600" id="dash-low-stock">0</p>
    </div>
  </div>

  <h3 class="font-bold text-slate-800 mb-4 text-sm px-1">Inventory Overview</h3>
  <div id="dash-list" class="space-y-3 pb-20">
    <div class="text-center text-slate-400 text-xs py-10">Memuat data...</div>
  </div>
</div>

<div id="page-input" class="view-section">
  <div class="mb-4 sticky top-20 z-40 bg-slate-50/95 backdrop-blur py-2">
    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Tanggal</label>
    <input type="date" id="inp-date" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm mb-4">
    
    <div class="relative">
      <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i>
      <input type="text" onkeyup="renderInputList(this.value)" placeholder="Cari barang..." class="w-full pl-10 bg-white border border-slate-200 rounded-xl py-3 text-sm outline-none focus:border-indigo-500 transition-colors">
    </div>
  </div>

  <div id="input-list" class="space-y-4 pb-24">
    </div>

  <button onclick="submitTransaction()" class="fixed bottom-24 right-4 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-xl shadow-indigo-600/30 flex items-center justify-center active:scale-90 transition-transform z-50">
    <i data-lucide="check" class="w-7 h-7"></i>
  </button>
</div>

<div id="page-labeling" class="view-section">
  <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center mb-6">
    <div class="bg-indigo-50 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-600">
      <i data-lucide="qr-code" class="w-6 h-6"></i>
    </div>
    <h2 class="text-lg font-bold text-slate-900">Print Label</h2>
    <p class="text-xs text-slate-500 mt-1">Pilih customer untuk cetak label pengiriman.</p>
    <button onclick="loadCustomers()" class="mt-4 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-lg active:scale-95 transition-transform">
      Refresh Data
    </button>
  </div>

  <div class="mb-4">
    <input type="text" id="cust-search" onkeyup="filterCustomers(this.value)" placeholder="Cari Customer / Kota..." class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
  </div>

  <div id="cust-list" class="space-y-3 pb-20">
    </div>
</div>

<div id="modal-print" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[80] hidden flex items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:w-80 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up">
    <h3 class="font-bold text-lg mb-1">Konfirmasi Cetak</h3>
    <p class="text-xs text-slate-500 mb-4" id="modal-cust-name">-</p>
    
    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Jumlah Box</label>
    <div class="flex items-center gap-4 mb-6">
      <button onclick="adjustQty(-1)" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center hover:bg-slate-200"><i data-lucide="minus" class="w-4 h-4"></i></button>
      <input type="number" id="print-qty" value="1" class="w-full text-center font-bold text-xl outline-none" readonly>
      <button onclick="adjustQty(1)" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center hover:bg-slate-200"><i data-lucide="plus" class="w-4 h-4"></i></button>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button onclick="closeModal()" class="py-3 rounded-xl font-bold text-sm text-slate-500 bg-slate-100">Batal</button>
      <button onclick="executePrint()" class="py-3 rounded-xl font-bold text-sm text-white bg-indigo-600 shadow-lg shadow-indigo-200">Cetak</button>
    </div>
  </div>
</div>

<div id="page-labeling" class="view-section">
  
  <div class="flex p-1 bg-slate-100 rounded-xl mb-4 mx-1">
    <button onclick="switchLabelTab('new')" id="tab-btn-new" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-indigo-600 transition-all">Buat Baru</button>
    <button onclick="switchLabelTab('history')" id="tab-btn-history" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition-all">Riwayat / Antrian</button>
  </div>

  <div id="tab-content-new">
    <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm mb-4">
      <h2 class="text-sm font-bold text-slate-800 mb-4">Pilih Customer</h2>
      <div class="relative mb-4">
        <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i>
        <input type="text" id="cust-search" onkeyup="filterCustomers(this.value)" placeholder="Cari Customer..." class="w-full pl-10 bg-slate-50 border-none rounded-xl py-3 text-sm focus:ring-2 focus:ring-indigo-200 outline-none">
      </div>
      <div id="cust-list" class="space-y-2 max-h-80 overflow-y-auto pb-4">
        </div>
    </div>
  </div>

  <div id="tab-content-history" class="hidden">
    <div class="flex justify-between items-center mb-3 px-2">
      <h3 class="text-xs font-bold text-slate-500 uppercase">Antrian Terakhir</h3>
      <button onclick="loadQueueHistory()" class="p-2 bg-white rounded-full shadow-sm text-indigo-600"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
    </div>
    <div id="queue-list" class="space-y-3 pb-24">
      <div class="text-center text-xs text-slate-400 py-10">Memuat data...</div>
    </div>
  </div>

</div>

<div id="modal-print" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[80] hidden flex items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:w-80 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up">
    <h3 class="font-bold text-lg mb-1">Cetak Label</h3>
    <p class="text-xs text-slate-500 mb-4 line-clamp-1" id="modal-cust-name">-</p>
    
    <div class="bg-slate-50 rounded-xl p-3 mb-4 flex items-center justify-between">
       <span class="text-xs font-bold text-slate-500">Jumlah Box</span>
       <div class="flex items-center gap-3">
          <button onclick="adjustQty(-1)" class="w-8 h-8 rounded-lg bg-white shadow text-slate-600 flex items-center justify-center"><i data-lucide="minus" class="w-3 h-3"></i></button>
          <input type="number" id="print-qty" value="1" class="w-10 text-center font-bold text-lg bg-transparent outline-none" readonly>
          <button onclick="adjustQty(1)" class="w-8 h-8 rounded-lg bg-white shadow text-slate-600 flex items-center justify-center"><i data-lucide="plus" class="w-3 h-3"></i></button>
       </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button onclick="processLabel('queue')" class="py-3 rounded-xl font-bold text-xs text-slate-600 bg-slate-100 border border-slate-200">
        Simpan Antrian
      </button>
      <button onclick="processLabel('print')" class="py-3 rounded-xl font-bold text-xs text-white bg-indigo-600 shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
        <i data-lucide="printer" class="w-3 h-3"></i> Direct Print
      </button>
    </div>
    <button onclick="closeModal()" class="w-full mt-3 py-2 text-xs font-medium text-slate-400">Batal</button>
  </div>
</div>
